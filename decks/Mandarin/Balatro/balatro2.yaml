cards:
    - character: 葫芦
      pinyin: hú lu
      meaning: Full House
      explanation: "葫 (艹 grass/plant + 胡 phonetic = bottle gourd), 芦 (艹 plant + 户 reed/vine = gourd). A bottle gourd has a small top bulb and a large bottom bulb, vividly mimicking the 2-card and 3-card structure of a Full House in Chinese card slang!"
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 同花顺
      pinyin: tóng huā shùn
      meaning: Straight Flush
      explanation: "同 (冂 cover over 口 mouth = identical), 花 (艹 grass + 化 transform = card suit), 顺 (川 river + 页 head = smooth sequence). Cards of the identical suit (同花) arranged in sequential rank order (顺) = Straight Flush!"
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 对子
      pinyin: duì zi
      meaning: Pair
      explanation: "对 (又 hand + 寸 measure rule; originally two hands matching or answering each other = pair, couple, match), 子 (child/noun suffix). Two matching cards of the same rank = Pair."
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 高牌
      pinyin: gāo pái
      meaning: High Card
      explanation: "高 (pictograph of a tall multi-story pavilion/tower with a roof and entrance = high, tall), 牌 (片 wood slice + 卑 tablet = card). The hand with no matching combinations, evaluated purely on its highest card = High Card."
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 幻灵牌
      pinyin: huàn líng pái
      meaning: Spectral Card
      explanation: "幻 (幺 tiny silk thread + 乚 deceptive twist = illusion, phantom), 灵 (雨 rain + 一/火 spiritual lightning / shaman dancing = spirit, soul, mystical), 牌 (card). Ghostly, otherworldly consumable cards that bring powerful and volatile effects = Spectral Card!"
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 小盲注
      pinyin: xiǎo máng zhù
      meaning: Small Blind
      explanation: "小 (pictograph of three small dividing marks = small), 盲 (亡 lost + 目 eye = blind), 注 (氵 water + 主 candle wick = bet/stake). The initial and gentlest blind challenge of an ante."
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 大盲注
      pinyin: dà máng zhù
      meaning: Big Blind
      explanation: "大 (pictograph of a person standing with arms and legs spread wide = big, great), 盲 (blind), 注 (bet/stake). The second blind hurdle of an ante, demanding a higher chip threshold."
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 三条
      pinyin: sān tiáo
      meaning: Three of a Kind
      explanation: "三 (three horizontal strokes representing heaven, earth, and mankind = three), 条 (木 tree/wood + 攵 branch = long narrow strip/twig; card slang for matching lines). Three cards sharing the identical rank = Three of a Kind!"
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 四条
      pinyin: sì tiáo
      meaning: Four of a Kind
      explanation: "四 (ancient pictograph of breath escaping from nostrils, borrowed for four = four), 条 (木 branch = card strip). Four cards sharing the identical rank = Four of a Kind!"
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 两对
      pinyin: liǎng duì
      meaning: Two Pair
      explanation: "两 (ancient pictograph of two horses harnessed to a carriage pole, or a scale with two equal pans = pair, two of), 对 (pair, couple). Two distinct pairs of cards in hand = Two Pair."
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
