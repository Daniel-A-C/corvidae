cards:
    - character: 游玩
      pinyin: yóu wán
      meaning: Play
      explanation: "游 (氵 water + 方 floating boat/flag + 子 child swimming = roam, play), 玩 (王/玉 jade + 元 origin = amuse oneself playing with precious jade). The main menu button to dive in and play!"
      interval: 1
      ease: 1.3
      next_review: "2026-09-02"
    - character: 继续
      pinyin: jì xù
      meaning: Continue
      explanation: "继 (纟 silk thread + 𢆶 succession = join threads -> follow, continue), 续 (纟 silk + 卖 lengthen = add thread to prolong -> continue). Button to resume an ongoing run."
      interval: 1
      ease: 1.3
      next_review: "2026-09-02"
    - character: 选项
      pinyin: xuǎn xiàng
      meaning: Options
      explanation: "选 (辶 walk + 巽 deliberate carefully = pick out, choose), 项 (工 work + 页 head/neck = item, entry, category). Settings menu for audio, video, and gameplay adjustments."
      interval: 1
      ease: 1.3
      next_review: "2026-09-02"
    - character: 退出
      pinyin: tuì chū
      meaning: Quit
      explanation: "退 (辶 walk + 艮 turn back/resist = step back, retreat), 出 (凵 container + foot stepping out = go out, exit). To exit the current run or quit the game entirely."
      interval: 1
      ease: 1.3
      next_review: "2026-09-02"
    - character: 收藏
      pinyin: shōu cáng
      meaning: Collection
      explanation: "收 (丩 harvest vines + 攵 hand tapping = gather, receive), 藏 (艹 herbs + 爿 bed + 臣 official + 戈 halberd = treasure guarded and stored secretly). The gallery viewing all discovered Jokers, decks, and vouchers."
      interval: 1
      ease: 1.3
      next_review: "2026-09-02"
    - character: 选择
      pinyin: xuǎn zé
      meaning: Select
      explanation: "选 (pick, elect), 择 (扌 hand radical + 睪 inspect with eye = pick by hand from among many). To confirm and lock in a deck, blind, or menu choice."
      interval: 1
      ease: 1.3
      next_review: "2026-09-02"
    - character: 跳过
      pinyin: tiào guò
      meaning: Skip
      explanation: "跳 (足 foot radical + 兆 crack of omen/split legs leaping = jump, leap), 过 (辶 walk + 寸 cross boundary = pass through). To leap past a Small or Big Blind in exchange for a Tag reward."
      interval: 1
      ease: 1.3
      next_review: "2026-09-02"
    - character: 返回
      pinyin: fǎn huí
      meaning: Back
      explanation: "返 (辶 walk + 反 hand turned over = turn around, reverse), 回 (pictograph of concentric swirling circles = return, circle back). UI navigation button to return to the previous screen."
      interval: 1
      ease: 1.3
      next_review: "2026-09-02"
    - character: 主菜单
      pinyin: zhǔ cài dān
      meaning: Main Menu
      explanation: "主 (candle flame atop lamp = main, host), 菜 (艹 herb + 采 pluck = dish), 单 (bill, flat sheet, list). 菜单 (càidān) means 'menu'; 主菜单 = Main Menu."
      interval: 1
      ease: 1.3
      next_review: "2026-09-02"
    - character: 对局信息
      pinyin: duì jú xìn xī
      meaning: Run Info
      explanation: "对局 (duì jú: 对 match/play against + 局 chess board/game session), 信息 (xìn xī: 信 trust/words + 息 breath/news = information). Button to inspect current deck contents, active vouchers, and run stats."
      interval: 1
      ease: 1.3
      next_review: "2026-09-02"
