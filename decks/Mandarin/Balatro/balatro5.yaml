cards:
    - character: 黑桃
      pinyin: hēi táo
      meaning: Spades
      explanation: "黑 (soot from fire 灬 under chimney = black), 桃 (木 tree + 兆 split = peach). 'Black peach' — the Chinese card term for Spades because the inverted leaf shape resembles a dark peach."
      interval: 1
      ease: 2.5
    - character: 红桃
      pinyin: hóng táo
      meaning: Hearts
      explanation: "红 (纟 silk + 工 work = reddish dyed silk), 桃 (peach). 'Red peach' — the Chinese card term for Hearts, mirroring the peach-like rounded lobes of the heart icon."
      interval: 1
      ease: 2.5
    - character: 方块
      pinyin: fāng kuài
      meaning: Diamonds
      explanation: "方 (carpenter's square = square, direction), 块 (土 earth + 夬 divide = clod, solid block). 'Square blocks' — Chinese card name for Diamonds due to its geometric rhombus shape."
      interval: 1
      ease: 2.5
    - character: 梅花
      pinyin: méi huā
      meaning: Clubs
      explanation: "梅 (木 tree + 每 fertile = plum tree/blossom), 花 (flower). 'Plum blossom' — Chinese card name for Clubs because the tri-lobed trefoil symbol resembles a blooming plum flower."
      interval: 1
      ease: 2.5
    - character: 人头牌
      pinyin: rén tóu pái
      meaning: Face Card
      explanation: "人 (person), 头 (豆 bean vessel + 页 head = head), 牌 (card). Literally 'person head card' = Face Cards (K, Q, J) that trigger Jokers like Scary Face and Pareidolia."
      interval: 1
      ease: 2.5
    - character: 国王
      pinyin: guó wáng
      meaning: King
      explanation: "国 (囗 walled city + 玉 jade/scepter = nation, kingdom), 王 (three realms linked by central axis = monarch, king). The King (K) card in playing cards."
      interval: 1
      ease: 2.5
    - character: 王后
      pinyin: wáng hòu
      meaning: Queen
      explanation: "王 (king), 后 (ancient ruler issuing commands from shelter = empress, queen). The Queen (Q) card in playing cards."
      interval: 1
      ease: 2.5
    - character: 杰克
      pinyin: jié kè
      meaning: Jack
      explanation: "杰 (木 tree + 灬 fire = towering hero, prominent), 克 (shoulder bearing armor = overcome). Phonetic transliteration for 'Jack' (J) in playing cards."
      interval: 1
      ease: 2.5
    - character: 牌组
      pinyin: pái zǔ
      meaning: Deck / Card Pool
      explanation: "牌 (card), 组 (纟 silk + 且 pedestal = braided cords, assembled set/team). Your full deck of cards (such as the starting Red, Blue, or Checkered decks)."
      interval: 1
      ease: 2.5
    - character: 手牌
      pinyin: shǒu pái
      meaning: Hand / Cards in hand
      explanation: "手 (pictograph of a hand with five fingers), 牌 (card). The active cards currently held in your hand waiting to be played or discarded."
      interval: 1
      ease: 2.5
    - character: 抽牌
      pinyin: chōu pái
      meaning: Draw cards
      explanation: "抽 (扌 hand + 由 sprout reaching upward = pull forth, draw out), 牌 (card). The action of drawing fresh replacement cards from your deck into your hand."
      interval: 1
      ease: 2.5
    - character: 消耗牌
      pinyin: xiāo hào pái
      meaning: Consumable Card
      explanation: "消 (氵 water + 肖 melt = vanish), 耗 (耒 plough + 毛 hair = wear down, expend), 牌 (card). Single-use consumables (Tarot, Planet, and Spectral cards) held in consumable slots."
      interval: 1
      ease: 2.5
