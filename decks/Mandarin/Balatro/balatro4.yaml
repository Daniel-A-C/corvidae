cards:
    - character: 商店
      pinyin: shāng diàn
      meaning: Shop
      explanation: 商 (shāng) means 'commerce/trade' and 店 (diàn) means 'shop/store'. Where you spend your hard-earned chips.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 刷新
      pinyin: shuā xīn
      meaning: Reroll
      explanation: 刷 (shuā) means 'to brush/swipe' and 新 (xīn) means 'new'. Used across UI/gaming in Chinese to mean 'refreshing' the page or shop offerings.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 利息
      pinyin: lì xī
      meaning: Interest
      explanation: 利 (lì) means 'profit/benefit' and 息 (xī) means 'interest/breath'. The extra $1 you earn for every $5 you hold at the end of a blind.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 出售
      pinyin: chū shòu
      meaning: Sell
      explanation: 出 (chū) means 'to go out' and 售 (shòu) means 'to sell'. Used when deleting a Joker from your lineup for cash.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 标签
      pinyin: biāo qiān
      meaning: Tag
      explanation: 标 (biāo) means 'mark/sign' and 签 (qiān) means 'label/ticket'. The reward you receive when you choose to skip a blind.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 版本
      pinyin: bǎn běn
      meaning: Edition
      explanation: 版 (bǎn) means 'printing plate/edition' and 本 (běn) means 'volume/root'. The category that Foil, Holographic, Polychrome, and Negative fall under.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 闪箔
      pinyin: shǎn bó
      meaning: Foil
      explanation: 闪 (shǎn) means 'flash/sparkle' and 箔 (bó) means 'foil/thin metal'. The edition that grants +50 Chips.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 镭射
      pinyin: léi shè
      meaning: Holographic
      explanation: 镭射 (léi shè) is a phonetic translation of the English word 'laser', commonly used in Chinese for holographic or laser-reflective materials. Grants +10 Mult.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 彩色
      pinyin: cǎi sè
      meaning: Polychrome
      explanation: 彩 (cǎi) means 'color/variety' and 色 (sè) means 'color'. The edition that grants an x1.5 Mult.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 负片
      pinyin: fù piàn
      meaning: Negative
      explanation: 负 (fù) means 'negative/minus' and 片 (piàn) means 'slice/film'. Like a photographic negative. Grants +1 Joker slot.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 印章
      pinyin: yìn zhāng
      meaning: Seal
      explanation: 印 (yìn) means 'print/stamp' and 章 (zhāng) means 'seal/badge'. Used for the Red, Blue, Gold, and Purple stamps on standard playing cards.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 万能牌
      pinyin: wàn néng pái
      meaning: Wild Card
      explanation: 万能 (wàn néng) means 'omnipotent' or 'all-purpose', and 牌 (pái) is 'card'. This card can be used as any suit.
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 玻璃牌
      pinyin: bō li pái
      meaning: Glass Card
      explanation: 玻璃 (bō li) means 'glass'. It grants an x2 Mult but has a 1 in 4 chance to shatter when played.
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 钢铁牌
      pinyin: gāng tiě pái
      meaning: Steel Card
      explanation: 钢铁 (gāng tiě) means 'steel'. It grants an x1.5 Mult while this card stays in your hand.
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 石头牌
      pinyin: shí tou pái
      meaning: Stone Card
      explanation: 石头 (shí tou) means 'stone'. A card with no rank or suit that simply adds 50 extra chips.
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 黄金牌
      pinyin: huáng jīn pái
      meaning: Gold Card
      explanation: 黄金 (huáng jīn) means 'gold'. Earns you $3 if it is held in your hand at the end of a round.
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
