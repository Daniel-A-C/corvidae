cards:
    - character: 商店
      pinyin: shāng diàn
      meaning: Shop
      explanation: "商 (ancient dynasty; trade, commerce), 店 (广 shelter + 占 territory = stall under a roof, shop). The marketplace between blinds where you purchase Jokers, vouchers, and card packs."
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 刷新
      pinyin: shuā xīn
      meaning: Reroll
      explanation: "刷 (巾 cloth/brush + 刂 scraper = swipe, brush clean), 新 (斤 axe + 木 tree + 立 = freshly cut fragrant wood -> brand new). To sweep away current shop offerings and generate a new selection."
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 利息
      pinyin: lì xī
      meaning: Interest
      explanation: "利 (禾 grain + 刂 sharp sickle = reap harvest profit), 息 (自 nose + 心 heart = calm breath, natural growth). Earning $1 for every $5 saved at round's end (up to the $25 cap)."
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 出售
      pinyin: chū shòu
      meaning: Sell
      explanation: "出 (foot stepping out = produce, put out), 售 (隹 bird + 口 mouth chirping at market = hawk goods, sell). Selling an active Joker or consumable for instant cash."
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 标签
      pinyin: biāo qiān
      meaning: Tag
      explanation: "标 (木 tree + 票 fluttering banner = signpost, label), 签 (竹 bamboo + 佥 together = inscribed bamboo slip). Skipping rewards that grant special shop perks, free editions, or money."
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 版本
      pinyin: bǎn běn
      meaning: Edition
      explanation: "版 (片 wood block + 反 turn = carved printing plate), 本 (木 tree + 一 root marker = root, volume). The special finish edition of a Joker (Foil, Holographic, Polychrome, Negative)."
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 闪箔
      pinyin: shǎn bó
      meaning: Foil
      explanation: "闪 (门 gate + 人 person slipping quickly through = flash, sparkle), 箔 (竹 bamboo + 泊 thin layer = hammered paper-thin metal leaf/foil). Foil edition cards granting +50 Chips."
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 镭射
      pinyin: léi shè
      meaning: Holographic
      explanation: "镭 (钅 metal + 雷 thunder = radium; phonetic for laser), 射 (身 body + 寸 hand releasing arrow = shoot beams). Laser/holographic iridescent sheen. Grants +10 Mult."
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 彩色
      pinyin: cǎi sè
      meaning: Polychrome
      explanation: "彩 (采 gather vibrant plants + 彡 brushstrokes = multicolored splendor), 色 (pigment, color). Polychrome prismatic edition granting a powerful x1.5 Multiplier!"
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 负片
      pinyin: fù piàn
      meaning: Negative
      explanation: "负 (⺈ person bearing load + 贝 money = carry burden, negative/minus), 片 (thin wooden slice, film sheet). Photographic negative inversion; grants +1 extra Joker slot."
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 印章
      pinyin: yìn zhāng
      meaning: Seal
      explanation: "印 (爪 hand pressing + 卩 kneeling figure = stamp, seal impression), 章 (音 music stanza + 十 complete = ornate crest/insignia). Special wax stamps on cards (Red, Blue, Gold, Purple)."
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 万能牌
      pinyin: wàn néng pái
      meaning: Wild Card
      explanation: "万 (ten thousand / all-encompassing), 能 (pictograph of a strong bear = power, capability), 牌 (card). Literally 'all-powerful card' — counts as any suit in the game (Wild Card)."
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 玻璃牌
      pinyin: bō li pái
      meaning: Glass Card
      explanation: "玻 (王/玉 jade + 皮 skin = glassy gem), 璃 (王/玉 jade + 离 radiant gem = crystal glaze). Glass card granting a potent x2 Mult, but with a 1 in 4 chance to shatter when played."
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 钢铁牌
      pinyin: gāng tiě pái
      meaning: Steel Card
      explanation: "钢 (钅 metal + 冈 mountain ridge = hardened metal, steel), 铁 (钅 metal + 𢧜 sturdy weapons = iron). Stays in hand to grant an x1.5 Mult each time a hand is scored."
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 石头牌
      pinyin: shí tou pái
      meaning: Stone Card
      explanation: "石 (cliff 厂 + fallen rock 口 = stone), 头 (head/noun suffix). A heavy card with no rank or suit that reliably contributes +50 extra chips to any played hand."
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 黄金牌
      pinyin: huáng jīn pái
      meaning: Gold Card
      explanation: "黄 (ancient chest amulet of yellow jade / yellow earth), 金 (earth 土 containing nuggets of metal under roof = gold, money). Earns $3 if held in hand at the conclusion of a round."
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
