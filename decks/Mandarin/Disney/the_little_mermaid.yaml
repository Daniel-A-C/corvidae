cards:
  - character: 小美人鱼
    pinyin: Xiǎo měi rén yú
    meaning: The Little Mermaid
    explanation: >
      小 (xiǎo) means 'little/young', 美人 (měirén) means 'beautiful woman/beauty', and 鱼 (yú) is the pictograph for 'fish'. Combined, 美人鱼 literally translates to 'beautiful fish person' (the Chinese word for mermaid), with 小美人鱼 representing the spirited mermaid princess Ariel in the beloved 1989 Disney classic.
    interval: 1
    ease: 2.5
  - character: 尾巴
    pinyin: wěi ba
    meaning: Tail (fish tail / mermaid tail)
    explanation: >
      尾 (wěi) combines 尸 (body) and 毛 (hair/feathers), anciently depicting a furry tail extending from an animal's rear, and 巴 (ba) serves as a soft noun suffix. Ariel longs to trade her emerald fishtail for human legs to walk on the land above the ocean surface.
    interval: 1
    ease: 2.5
  - character: 歌声
    pinyin: gē shēng
    meaning: Singing voice
    explanation: >
      歌 (gē) combines 哥 (singing cadence) with 欠 (open mouth yawning/breathing out song) and 声 (shēng) means 'sound/voice'. Ariel's luminous, enchanting singing voice captures Prince Eric's heart after she rescues him from shipwreck, leading Ursula to demand her voice as the price for human form.
    interval: 1
    ease: 2.5
  - character: 贝壳
    pinyin: bèi ké
    meaning: Seashell
    explanation: >
      贝 (bèi) is the ancient pictograph for a cowrie mollusk shell (which also served as China's earliest currency), and 壳 (ké) means 'hard outer shell or casing'. In the film, Ursula traps Ariel's glowing golden voice inside a glowing nautilus seashell pendant worn around her neck.
    interval: 1
    ease: 2.5
  - character: 巫婆
    pinyin: wū pó
    meaning: Sea witch / Sorceress
    explanation: >
      巫 (wū) depicts shamans dancing between heaven and earth with tools, meaning 'sorcerer/witch', and 婆 (pó) means 'old woman/crone' (with the 女 woman radical below 波). Refers to the sinister cecaelia sea witch Ursula (乌苏拉), who preys on poor unfortunate souls seeking deals.
    interval: 1
    ease: 2.5
  - character: 契约
    pinyin: qì yuē
    meaning: Contract / Binding pact
    explanation: >
      契 (qì) depicts a carved tally notched with a knife 刀 for proof, and 约 (yuē) features the silk thread radical 纟, meaning binding agreement or appointment. Ariel signs Ursula's golden glowing scroll contract with a quill to gain three days as a human.
    interval: 1
    ease: 2.5
  - character: 双腿
    pinyin: shuāng tuǐ
    meaning: A pair of legs
    explanation: >
      双 (shuāng) depicts two hands holding two birds = a pair/couple, and 腿 (tuǐ) combines the flesh radical 月/肉 with 退 (retreat/stride). Ariel dreams of dancing, jumping, and strolling along the sand with a pair of human legs.
    interval: 1
    ease: 2.5
  - character: 叉子
    pinyin: chā zi
    meaning: Fork ("Dinglehopper")
    explanation: >
      叉 (chā) is a pictograph of a branching tool or fork, and 子 (zi) is the noun suffix. Misidentified by Scuttle the seagull as a 'dinglehopper' used for brushing hair, leading to a delightfully comedic moment when Ariel combs her red hair with a dinner fork at the royal dining table.
    interval: 1
    ease: 2.5
  - character: 雕像
    pinyin: diāo xiàng
    meaning: Statue (Prince Eric's marble statue)
    explanation: >
      雕 (diāo) features 彡 (carving marks) and 隹 (bird), meaning to carve or sculpt, and 像 (xiàng) means 'likeness/figure' (with the person radical 亻). Ariel secretly salvages Prince Eric's sunken marble statue and keeps it nestled in her hidden underwater grotto.
    interval: 1
    ease: 2.5
  - character: 浪花
    pinyin: làng huā
    meaning: Ocean spray / Waves
    explanation: >
      浪 (làng) combines the water radical 氵 with 良 (flowing freely), meaning billowing waves, and 花 (huā) means 'flower/spray'. Evokes the iconic cinematic image of Ariel splashing against the rocky outcrop as towering waves crash behind her during "Part of Your World".
    interval: 1
    ease: 2.5
  - character: 收藏
    pinyin: shǒu cáng
    meaning: Secret collection / Treasures
    explanation: >
      收 (shōu) means 'to gather/receive' and 藏 (cáng) means 'to hide/store away'. Ariel's secret cavern filled with gadgets, gizmos, aplenty, and human artifacts hidden from King Triton's watchful gaze.
    interval: 1
    ease: 2.5
