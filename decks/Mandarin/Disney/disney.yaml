cards:
  - character: 迪士尼乐园
    pinyin: Díshīní lèyuán
    meaning: Disneyland
    explanation: "迪士尼 (Díshīní) is the phonetic translation for Disney. 乐园 (lèyuán) means 'amusement park' (literally: happy garden)."
  - character: 创极速光轮
    pinyin: Chuàng jísù guānglún
    meaning: TRON Lightcycle Power Run
    explanation: "创 (Chuàng) is TRON, 极速 (jísù) means 'extreme speed', 光 (guāng) is 'light', and 轮 (lún) is 'wheel/cycle'."
  - character: 加勒比海盗
    pinyin: Jiālèbǐ hǎidào
    meaning: Pirates of the Caribbean
    explanation: "加勒比 (Jiālèbǐ) is phonetic for Caribbean. 海 (hǎi) is 'sea' and 盗 (dào) is 'robber/thief'."
  - character: 疯狂动物城
    pinyin: Fēngkuáng dòngwù chéng
    meaning: Zootopia
    explanation: "疯狂 (Fēngkuáng) means 'crazy/frantic', 动物 (dòngwù) means 'animal', and 城 (chéng) means 'city'. 'Crazy Animal City' is the official Chinese title."
  - character: 雷鸣山漂流
    pinyin: Léimíng shān piāoliú
    meaning: Roaring Rapids
    explanation: "雷鸣 (Léimíng) means 'thunderous roar', 山 (shān) is 'mountain', and 漂流 (piāoliú) means 'rafting/drifting'."
  - character: 七个小矮人矿山车
    pinyin: Qī gè xiǎo ǎirén kuàngshān chē
    meaning: Seven Dwarfs Mine Train
    explanation: "七个 (seven), 小矮人 (little short people / dwarfs), 矿 (mine), 山 (mountain), 车 (car/train)."
  - character: 尊享卡
    pinyin: zūnxiǎng kǎ
    meaning: Premier Access (FastPass)
    explanation: "尊 (zūn) means 'honorable/respected', 享 (xiǎng) means 'to enjoy', and 卡 (kǎ) means 'card'. Respected enjoyment card."
  - character: 排队时间
    pinyin: páiduì shíjiān
    meaning: Wait time / Queue time
    explanation: "排队 (páiduì) means 'to line up' (literally: arrange a queue). 时间 (shíjiān) means 'time'."
  - character: 门票
    pinyin: ménpiào
    meaning: Ticket
    explanation: "门 (mén) means 'door/gate' and 票 (piào) means 'ticket'. The gate admission ticket."
  - character: 奇幻童话城堡
    pinyin: Qíhuàn tónghuà chéngbǎo
    meaning: Enchanted Storybook Castle
    explanation: "奇幻 (qíhuàn) means 'fantasy/magical', 童话 (tónghuà) means 'fairy tale', and 城堡 (chéngbǎo) means 'castle'."
  - character: 花车巡游
    pinyin: huāchē xúnyóu
    meaning: Parade
    explanation: "花 (huā) means 'flower/decorated', 车 (chē) is 'car', and 巡游 (xúnyóu) means 'patrol/parade'. Decorated float parade."
  - character: 奇梦之光幻影秀
    pinyin: Qímèng zhī guāng huànyǐng xiù
    meaning: Nighttime Spectacular (Fireworks)
    explanation: "奇梦 (wondrous dream) 之 (of) 光 (light) 幻影 (phantom/illusion) 秀 (show - phonetic). The show of light and illusion of wondrous dreams."
  - character: 迪士尼小镇
    pinyin: Díshīní xiǎozhèn
    meaning: Disneytown
    explanation: "迪士尼 (Disney) + 小镇 (small town)."
  - character: 纪念品
    pinyin: jìniànpǐn
    meaning: Souvenir
    explanation: "纪 (jì) means 'to record', 念 (niàn) means 'thought/memory', and 品 (pǐn) means 'item'. An item that records a memory."
