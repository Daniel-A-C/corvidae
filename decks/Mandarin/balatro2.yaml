cards:
    - character: 葫芦
      pinyin: hú lu
      meaning: Full House
      explanation: 葫 (hú) and 芦 (lu) together mean 'bottle gourd'. This is the standard Chinese poker slang for a Full House, likely because the shape of a gourd (small top, big bottom) mimics the pair-and-three-of-a-kind structure.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 同花顺
      pinyin: tóng huā shùn
      meaning: Straight Flush
      explanation: A literal combination of previous terms. 同花 (tóng huā) means 'same suit/flush', and 顺 (shùn) means 'straight/sequence'.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 对子
      pinyin: duì zi
      meaning: Pair
      explanation: 对 (duì) means 'pair/couple' and 子 (zi) is a standard noun suffix. Two cards of the same rank.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 高牌
      pinyin: gāo pái
      meaning: High Card
      explanation: 高 (gāo) means 'high/tall', and 牌 (pái) is 'card'. The lowest scoring hand type.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 幻灵牌
      pinyin: huàn líng pái
      meaning: Spectral Card
      explanation: 幻 (huàn) means 'illusion/phantom', and 灵 (líng) means 'spirit/soul'. The ghostly, high-risk/high-reward blue cards.
      interval: 1
      ease: 1.3
      next_review: "2026-08-28"
    - character: 小盲注
      pinyin: xiǎo máng zhù
      meaning: Small Blind
      explanation: 小 (xiǎo) means 'small', combined with 盲注 (máng zhù) for 'blind bet' from balatro1.yaml. This is the easiest round of an ante.
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 大盲注
      pinyin: dà máng zhù
      meaning: Big Blind
      explanation: 大 (dà) means 'big' or 'large'. The second round of an ante, which requires more chips than the small blind.
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 三条
      pinyin: sān tiáo
      meaning: Three of a Kind
      explanation: 三 (sān) means 'three' and 条 (tiáo) is a classifier for long, narrow things. This is standard Chinese poker slang for three cards of the same rank.
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 四条
      pinyin: sì tiáo
      meaning: Four of a Kind
      explanation: 四 (sì) means 'four'. Four cards of the same rank.
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 两对
      pinyin: liǎng duì
      meaning: Two Pair
      explanation: 两 (liǎng) means 'two' (used for quantities) and 对 (duì) means 'pair'. Two different pairs of cards.
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
