cards:
    - character: 成
      pinyin: chéng
      meaning: To become / Turn into
      explanation: '戈 (weapon) + 丁. To accomplish, take form, or become (道成了肉身: the eternal Word assumed mortal human nature).'
      interval: 1
      ease: 2.5
    - character: 肉身
      pinyin: ròu shēn
      meaning: Flesh / Physical human body
      explanation: '肉 (flesh) + 身 (body). Translates Greek sarx. Highlights the startling mystery of the Incarnation: God genuinely became human.'
      interval: 1
      ease: 2.5
    - character: 住
      pinyin: zhù
      meaning: To dwell / Tabernacle
      explanation: '亻 (person) + 主 (master). Translates Greek eskenosen: ''tabernacled'' among us, echoing God dwelling in the wilderness Tabernacle.'
      interval: 1
      ease: 2.5
    - character: 我们
      pinyin: wǒ men
      meaning: We / Us
      explanation: 我 (I / self) + 们 (plural suffix). The eyewitness apostolic community declaring firsthand experience of Christ.
      interval: 1
      ease: 2.5
    - character: 中间
      pinyin: zhōng jiān
      meaning: Among / In the midst of / Between
      explanation: 中 (center) + 间 (interval / space). God did not remain distant, but entered right into the midst of human life.
      interval: 1
      ease: 2.5
    - character: 充充满满
      pinyin: chōng chōng mǎn mǎn
      meaning: Full of / Overflowing / Abounding
      explanation: 'Reduplication of 充 (fill) and 满 (full). Vivid poetic expression for plērēs: inexhaustible, superabundant fullness.'
      interval: 1
      ease: 2.5
    - character: 恩典
      pinyin: ēn diǎn
      meaning: Grace / Unmerited divine favor
      explanation: '恩 (kindness / grace from heart 心) + 典 (standard / sacred canon). Translates Greek charis: unconditional love and favor given to the undeserving.'
      interval: 1
      ease: 2.5
    - character: 真理
      pinyin: zhēn lǐ
      meaning: Truth / Ultimate reality
      explanation: '真 (true / genuine) + 理 (order / inner principle). Translates Hebrew emet and Greek alētheia: divine reliability and revelation.'
      interval: 1
      ease: 2.5
    - character: 见过
      pinyin: jiàn guò
      meaning: Have seen / Beheld with own eyes
      explanation: '见 (to see) + 过 (experiential aspect marker). Emphasizes verified eyewitness testimony: ''we have beheld His glory''.'
      interval: 1
      ease: 2.5
    - character: 荣光
      pinyin: róng guāng
      meaning: Glory / Radiant splendor
      explanation: '荣 (honor / splendor) + 光 (light). Translates Greek doxa and Hebrew shekinah: the radiant outward manifestation of God''s presence.'
      interval: 1
      ease: 2.5
    - character: 正是
      pinyin: zhèng shì
      meaning: Precisely / Exactly / Is none other than
      explanation: 正 (straight / exact) + 是 (to be). Identifies Christ's glory as exactly matching the unique glory of the Father's Son.
      interval: 1
      ease: 2.5
    - character: 父
      pinyin: fù
      meaning: Father / The Heavenly Father
      explanation: Pictograph of a hand holding a rod/torch of paternal leadership. Revering God the Father.
      interval: 1
      ease: 2.5
    - character: 独生子
      pinyin: dú shēng zǐ
      meaning: Only begotten Son / One and only Son
      explanation: '独 (alone / unique) + 生 (begotten) + 子 (son). Translates Greek monogenēs: the unique, beloved, one-of-a-kind Son of God.'
      interval: 1
      ease: 2.5
    - character: 喊着
      pinyin: hǎn zhe
      meaning: Crying out / Proclaiming boldly
      explanation: 喊 (shout 口 + 咸 all) + 着 (continuous aspect). Depicts John lifting his voice with prophetic urgency and passion.
      interval: 1
      ease: 2.5
    - character: 曾
      pinyin: céng
      meaning: Once / Previously / Ever
      explanation: 'Adverb indicating past action: ''This is He of whom I said...'' (这就是我曾说).'
      interval: 1
      ease: 2.5
    - character: 以后
      pinyin: yǐ hòu
      meaning: After / Afterwards
      explanation: 以 (relative point) + 后 (after / behind). Referring to chronological arrival (coming after John in public ministry).
      interval: 1
      ease: 2.5
    - character: 反
      pinyin: fǎn
      meaning: On the contrary / Has turned out to be
      explanation: 'Depicts a hand turning upside down. Marks a surprising elevation: though coming after, He ranks ahead.'
      interval: 1
      ease: 2.5
    - character: 以前
      pinyin: yǐ qián
      meaning: Before / Prior to
      explanation: 以 (relative point) + 前 (in front / prior). Signifies both pre-eminent rank ('ranks before me') and temporal pre-existence.
      interval: 1
      ease: 2.5
