cards:
    - character: 指着
      pinyin: zhǐ zhe
      meaning: Pointing at / Referring to
      explanation: 指 (finger / point 扌+旨) + 着. Jesus singling out Nathanael as he approached.
      interval: 1
      ease: 2.5
    - character: 真
      pinyin: zhēn
      meaning: True / Genuine
      explanation: 'Authentic without hypocrisy: ''an Israelite indeed'' (真以色列人), contrasting with Jacob before his transformation.'
      interval: 1
      ease: 2.5
    - character: 心里
      pinyin: xīn lǐ
      meaning: In the heart / Inside
      explanation: 心 (heart) + 里 (interior). Jesus perceives the hidden inner character of human hearts.
      interval: 1
      ease: 2.5
    - character: 诡诈
      pinyin: guǐ zhà
      meaning: Guile / Deceit / Craftiness
      explanation: 诡 (cunning 讠+危) + 诈 (deceit 讠+乍). Treachery or deception; Nathanael was honest, open, and without deceit.
      interval: 1
      ease: 2.5
    - character: 知道
      pinyin: zhī dào
      meaning: To know / Be aware of
      explanation: '知 (know 矢+口) + 道 (way). Nathanael asked: ''How do You know me?'''
      interval: 1
      ease: 2.5
    - character: 招呼
      pinyin: zhāo hu
      meaning: To call / Summon / Greet
      explanation: 招 (beckon with hand 扌) + 呼 (call out 口). Philip calling out to Nathanael to come meet Jesus.
      interval: 1
      ease: 2.5
    - character: 无花果树
      pinyin: wú huā guǒ shù
      meaning: Fig tree
      explanation: 无 (without) + 花 (flower) + 果 (fruit) + 树 (tree). A symbol of peace and prosperity in Israel under whose branches pious Jews prayed and meditated.
      interval: 1
      ease: 2.5
    - character: 底下
      pinyin: dǐ xia
      meaning: Underneath / Below
      explanation: 底 (bottom 广+氐) + 下 (under). Jesus saw Nathanael in supernatural omniscience while he sat under the tree.
      interval: 1
      ease: 2.5
    - character: 王
      pinyin: wáng
      meaning: King
      explanation: 'Radical 玉/王. Vertical line connecting heaven, earth, and mankind. Nathanael exclaims: ''You are the King of Israel!'''
      interval: 1
      ease: 2.5
    - character: 因为
      pinyin: yīn wèi
      meaning: Because
      explanation: '因 (cause) + 为 (for). Jesus asking: ''Do you believe because I said I saw you under the fig tree?'''
      interval: 1
      ease: 2.5
    - character: 更大
      pinyin: gèng dà
      meaning: Greater
      explanation: 更 (even more) + 大 (great). Promising visions of divine glory surpassing any earthly sign.
      interval: 1
      ease: 2.5
    - character: 事
      pinyin: shì
      meaning: Things / Works / Events
      explanation: Radical 亅. Deeds, events, and divine wonders (比这更大的事 = greater things than these).
      interval: 1
      ease: 2.5
    - character: 实实在在
      pinyin: shí shí zài zài
      meaning: Truly, truly / Verily, verily (Amen, Amen)
      explanation: Reduplication of 实在 (true/solid). Translates the Hebrew solemn formula 'Amen, Amen' used exclusively by Jesus to introduce momentous truth.
      interval: 1
      ease: 2.5
    - character: 告诉
      pinyin: gào su
      meaning: To tell / Declare to
      explanation: 告 (declare / report 牛+口) + 诉 (speak out 讠+斥). Direct authoritative declaration to all disciples.
      interval: 1
      ease: 2.5
    - character: 天开了
      pinyin: tiān kāi le
      meaning: Heaven opened
      explanation: 天 (heaven) + 开 (open) + 了 (completion). The spiritual realm unveiled for communion between God and man.
      interval: 1
      ease: 2.5
    - character: 使者
      pinyin: shǐ zhě
      meaning: Angels / Messengers of God
      explanation: '使 (sent on mission 亻+吏) + 者 (person). Translates Greek angeloi: heavenly hosts serving God.'
      interval: 1
      ease: 2.5
    - character: 上去下来
      pinyin: shàng qu xià lai
      meaning: Ascending and descending
      explanation: 上去 (ascend) + 下来 (descend). Alludes to Jacob's dream at Bethel (Genesis 28:12); Christ is the true ladder connecting heaven and earth.
      interval: 1
      ease: 2.5
    - character: 人子
      pinyin: rén zǐ
      meaning: The Son of Man
      explanation: 人 (man / humanity) + 子 (son). Jesus's exalted messianic title from Daniel 7:13-14, combining humanity and heavenly majesty.
      interval: 1
      ease: 2.5
