cards:
    - character: 本来
      pinyin: běn lái
      meaning: Originally / Inherently / In essence
      explanation: 本 (tree root / origin) + 来 (come). Christ 'was before me' because He existed from all eternity prior to John's birth.
      interval: 1
      ease: 2.5
    - character: 丰满
      pinyin: fēng mǎn
      meaning: Fullness / Plenitude / Abundance
      explanation: '丰 (luxuriant harvest) + 满 (full). Translates Greek plērōma: the infinite, overflowing completeness of the divine nature.'
      interval: 1
      ease: 2.5
    - character: 领受
      pinyin: lǐng shòu
      meaning: To receive / Partake of
      explanation: 领 (to lead / receive) + 受 (accept). Respectful compound for joyfully taking in the gifts of God's grace.
      interval: 1
      ease: 2.5
    - character: 而且
      pinyin: ér qiě
      meaning: Moreover / Furthermore / And also
      explanation: 而 (and / connecting clause) + 且 (furthermore). Conjunction intensifying the abundance of blessing.
      interval: 1
      ease: 2.5
    - character: 恩上加恩
      pinyin: ēn shàng jiā ēn
      meaning: Grace upon grace
      explanation: '恩 (grace) + 上 (upon) + 加 (add) + 恩 (grace). Translates charin anti charitos: wave upon wave of limitless grace continually replacing grace.'
      interval: 1
      ease: 2.5
    - character: 律法
      pinyin: lǜ fǎ
      meaning: The Law (Torah)
      explanation: 律 (statute / musical pitch standard) + 法 (law / pattern). Refers to the Mosaic covenant given at Mount Sinai.
      interval: 1
      ease: 2.5
    - character: 摩西
      pinyin: Mó xī
      meaning: Moses
      explanation: Standard Chinese transliteration of Hebrew Moshe ('drawn out of water'), the lawgiver of Israel.
      interval: 1
      ease: 2.5
    - character: 传
      pinyin: chuán
      meaning: To pass down / Deliver / Transmit
      explanation: 亻 (person) + 专 (spindle / focus). The Law was mediated and transmitted through Moses.
      interval: 1
      ease: 2.5
    - character: 由
      pinyin: yóu
      meaning: Through / By / Originating from
      explanation: 'Pictograph of oil sprouting from seed. Preposition indicating origin: grace and truth came through Jesus Christ.'
      interval: 1
      ease: 2.5
    - character: 耶稣基督
      pinyin: Yē sū Jī dū
      meaning: Jesus Christ
      explanation: '耶稣 (Yeshua: Yahweh is salvation) + 基督 (Christos: the Anointed Messiah). The central figure of all redemptive history.'
      interval: 1
      ease: 2.5
    - character: 从来
      pinyin: cóng lái
      meaning: Ever / (with negative) Never
      explanation: '从 (from) + 来 (come). Indicates from the beginning of time: ''No one has ever seen God at any time'' (从来没有人看见神).'
      interval: 1
      ease: 2.5
    - character: 看见
      pinyin: kàn jiàn
      meaning: To see / Behold
      explanation: 看 (look with hand over eye) + 见 (perceive / vision). Visual perception of God's unapproachable majesty.
      interval: 1
      ease: 2.5
    - character: 只有
      pinyin: zhǐ yǒu
      meaning: Only / There is only
      explanation: '只 (only / single) + 有 (exist). Exclusivity marker: only the unique Son can reveal the Father.'
      interval: 1
      ease: 2.5
    - character: 怀里
      pinyin: huái lǐ
      meaning: In the bosom / Intimate embrace of
      explanation: 怀 (bosom / heart 忄) + 里 (inside). Describes the deepest, most intimate relational communion between Father and Son.
      interval: 1
      ease: 2.5
    - character: 表明
      pinyin: biǎo míng
      meaning: To make known / Reveal / Explain
      explanation: '表 (outward garment / to show) + 明 (bright). Translates Greek exēgēsato (exegesis): Jesus fully unfolded, interpreted, and displayed God.'
      interval: 1
      ease: 2.5
    - character: 都
      pinyin: dōu
      meaning: All / Both
      explanation: '阝 (city) + 者. Universal adverb: ''we have all received of His fullness'' (我们都领受了).'
      interval: 1
      ease: 2.5
    - character: 和
      pinyin: hé
      meaning: And / Together with
      explanation: '禾 (grain) + 口 (mouth). Coordinating conjunction joining twin virtues: ''grace and truth'' (恩典和真理).'
      interval: 1
      ease: 2.5
    - character: 将
      pinyin: jiāng
      meaning: Object marker / To take
      explanation: 寸 (hand) + 丬. Pre-transitive object marker in '将他表明出来' (has revealed/explained Him).
      interval: 1
      ease: 2.5
