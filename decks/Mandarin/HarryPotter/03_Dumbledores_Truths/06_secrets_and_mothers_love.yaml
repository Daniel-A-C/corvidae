cards:
    - character: 充分
      pinyin: chōng fēn
      meaning: Full / Ample / Sufficient / Thorough
      explanation: 充 (fill/full) + 分 (portion/measure). Modifying 准备 (preparations) for fighting Voldemort to the death.
      interval: 1
      ease: 2.5
    - character: 决一死战
      pinyin: jué yī sǐ zhàn
      meaning: To fight a decisive battle to the death
      explanation: 决 (decide/fight out) + 一 (one) + 死战 (battle to the death). Idiom for the ultimate life-and-death showdown against Voldemort.
      interval: 1
      ease: 2.5
    - character: 一而再
      pinyin: yī ér zài
      meaning: Once and then again / Time and again
      explanation: 一 (once) + 而 (and then) + 再 (twice/again). Paired with 再而三 to mean 'again and again'; if Voldemort is repeatedly delayed, he may never regain power.
      interval: 1
      ease: 2.5
    - character: 再而三
      pinyin: zài ér sān
      meaning: Again and a third time / Repeatedly
      explanation: 再 (twice/again) + 而 (and then) + 三 (three times). Completes the idiom 一而再、再而三 (time and time again).
      interval: 1
      ease: 2.5
    - character: 再也
      pinyin: zài yě
      meaning: Never again / No longer (with negation)
      explanation: 再 (again) + 也 (also/ever, used before negative 无法/不). Emphasizes that Voldemort might never be able to recover his strength.
      interval: 1
      ease: 2.5
    - character: 点头
      pinyin: diǎn tóu
      meaning: To nod one's head
      explanation: 点 (to bob/dot) + 头 (head). Harry nods at Dumbledore's words (`点了点头`) before stopping because it makes his head ache.
      interval: 1
      ease: 2.5
    - character: 停
      pinyin: tíng
      meaning: To stop / To halt / To cease
      explanation: 亻 (person) + 亭 (pavilion where travelers rest). Harry quickly stops nodding (`停住了`) due to the pain in his head.
      interval: 1
      ease: 2.5
    - character: 因为
      pinyin: yīn wèi
      meaning: Because / Owing to
      explanation: '因 (cause/reason) + 为 (for/because of). Explains why Harry stopped nodding: because it made his head ache.'
      interval: 1
      ease: 2.5
    - character: 了解
      pinyin: liǎo jiě
      meaning: To understand / To find out / To know well
      explanation: '了 (liǎo: to understand clearly) + 解 (to untie/explain). Harry tells Dumbledore he wants to understand the truth about certain things.'
      interval: 1
      ease: 2.5
    - character: 真相
      pinyin: zhēn xiàng
      meaning: The truth / The actual facts
      explanation: '真 (true/real) + 相 (xiàng: appearance/features). The true state of affairs that Harry asks Dumbledore to reveal.'
      interval: 1
      ease: 2.5
    - character: 叹息
      pinyin: tàn xī
      meaning: To sigh
      explanation: '叹 (口 mouth + 又: to sigh) + 息 (breath). Dumbledore sighs as he reflects on the nature of truth.'
      interval: 1
      ease: 2.5
    - character: 美丽
      pinyin: měi lì
      meaning: Beautiful
      explanation: '美 (羊 sheep + 大 big: fine/beautiful) + 丽 (graceful/lovely). Dumbledore calls the truth ''a beautiful and terrible thing'' (`美丽而可怕的东西`).'
      interval: 1
      ease: 2.5
    - character: 格外
      pinyin: gé wài
      meaning: Especially / Extraordinarily / Particularly
      explanation: 格 (standard/grid) + 外 (beyond/outside). Beyond the usual measure; truth must be treated with extra caution (`格外谨慎`).
      interval: 1
      ease: 2.5
    - character: 谨慎
      pinyin: jǐn shèn
      meaning: Cautious / Prudent / Circumspect
      explanation: '谨 (讠 speech + 堇: careful in words) + 慎 (忄 heart + 真: careful in mind). Dumbledore warns that truth must be handled with great caution.'
      interval: 1
      ease: 2.5
    - character: 对待
      pinyin: duì dài
      meaning: To treat / To handle / To approach
      explanation: 对 (toward/face) + 待 (to treat/deal with). How one handles or approaches something weighty like the truth.
      interval: 1
      ease: 2.5
    - character: 尽量
      pinyin: jǐn liàng
      meaning: As much as possible / To do one's utmost
      explanation: '尽 (jǐn: to the greatest extent) + 量 (capacity/limit). Dumbledore promises to answer Harry''s questions as best he can.'
      interval: 1
      ease: 2.5
    - character: 除非
      pinyin: chú fēi
      meaning: Unless / Only if
      explanation: '除 (except/exclude) + 非 (not). Conjunction introducing an exception: unless Dumbledore has a good reason to remain silent.'
      interval: 1
      ease: 2.5
    - character: 理由
      pinyin: lǐ yóu
      meaning: Reason / Grounds / Justification
      explanation: 理 (principle/logic) + 由 (cause/origin). A valid justification for keeping a secret.
      interval: 1
      ease: 2.5
    - character: 守口如瓶
      pinyin: shǒu kǒu rú píng
      meaning: To keep one's mouth shut tight / To be tight-lipped
      explanation: 守 (guard) + 口 (mouth) + 如 (like) + 瓶 (jar/bottle stopper). Idiom meaning to guard a secret strictly without leaking a word.
      interval: 1
      ease: 2.5
    - character: 的话
      pinyin: de huà
      meaning: If (conditional particle placed at end of clause)
      explanation: 的 (particle) + 话 (words/case). Used in `那样的话` ('if that is the case / in that case'), where Dumbledore asks for Harry's forgiveness.
      interval: 1
      ease: 2.5
    - character: 话又说回来
      pinyin: huà yòu shuō huí lái
      meaning: Then again / On the other hand / Coming back to the point
      explanation: '话 (words) + 又 (again) + 说回来 (speak back). Conversational pivot Harry uses to return to the core question: why did Voldemort want to kill him in the first place?'
      interval: 1
      ease: 2.5
    - character: 这次
      pinyin: zhè cì
      meaning: This time
      explanation: 这 (this) + 次 (time/occurrence). Dumbledore sighs heavily this time when Harry asks why Voldemort tried to kill him.
      interval: 1
      ease: 2.5
    - character: 重重地
      pinyin: zhòng zhòng de
      meaning: Heavily / Hard / Profoundly
      explanation: '重重 (zhòng zhòng: reduplicated ''heavy'') + 地 (de: adverbial suffix). Modifies Dumbledore''s deep, heavy sigh (`重重地叹了口气`).'
      interval: 1
      ease: 2.5
    - character: 叹
      pinyin: tàn
      meaning: To sigh
      explanation: 口 (mouth) + 又 (hand/again). Used in the phrase `叹了口气` (heaved a sigh).
      interval: 1
      ease: 2.5
    - character: 口气
      pinyin: kǒu qì
      meaning: Breath / Tone of voice
      explanation: 口 (mouth) + 气 (air/breath). Here in `叹了口气` it literally means 'a mouthful of breath' (heaved a sigh).
      interval: 1
      ease: 2.5
    - character: 哎呀
      pinyin: āi yā
      meaning: Alas / Oh dear / Ah
      explanation: 哎 (interjection of sigh/surprise) + 呀 (modal particle). Expresses Dumbledore's gentle regret that he cannot answer the very first thing Harry asks.
      interval: 1
      ease: 2.5
    - character: 今天
      pinyin: jīn tiān
      meaning: Today
      explanation: 今 (now/present) + 天 (day). Dumbledore tells Harry he cannot tell him today (`今天不能，现在不能`).
      interval: 1
      ease: 2.5
    - character: 暂时
      pinyin: zàn shí
      meaning: For the time being / Temporarily
      explanation: 暂 (short time/briefly) + 时 (time). Dumbledore advises Harry to put the question out of his mind for now.
      interval: 1
      ease: 2.5
    - character: 长大
      pinyin: zhǎng dà
      meaning: To grow up / To grow older
      explanation: '长 (zhǎng: to grow) + 大 (big/old). Dumbledore tells Harry he will know when he has grown up a bit more (`等你再长大一些`).'
      interval: 1
      ease: 2.5
    - character: 碰
      pinyin: pèng
      meaning: To touch / To bump into
      explanation: 石 (stone) + 并 (side by side / collide). Harry asks why Quirrell could not bear to touch him (`不能碰我`).
      interval: 1
      ease: 2.5
    - character: 爱
      pinyin: ài
      meaning: Love / To love
      explanation: '爫 (claw/hand) + 冖 (cover) + 心 (heart, in traditional 愛) + 友 (friend). The one supreme power Voldemort cannot comprehend: Lily''s sacrificial love.'
      interval: 1
      ease: 2.5
    - character: 深深
      pinyin: shēn shēn
      meaning: Deeply / Profoundly
      explanation: '深 (氵 water + 罙: deep) reduplicated for intensity. Describes how deeply Harry''s mother loved him (`深深的爱`).'
      interval: 1
      ease: 2.5
    - character: 留下
      pinyin: liú xià
      meaning: To leave behind
      explanation: 留 (to remain/leave) + 下 (down/behind). Sacrificial love leaves behind its own enduring mark on the person saved.
      interval: 1
      ease: 2.5
    - character: 印记
      pinyin: yìn jì
      meaning: Mark / Imprint / Stamp
      explanation: 印 (seal/stamp) + 记 (mark/sign). The invisible mark of protection left on Harry by his mother's love.
      interval: 1
      ease: 2.5
    - character: 痕迹
      pinyin: hén jì
      meaning: Trace / Mark / Vestige / Scar
      explanation: '痕 (疒 sickness/skin mark + 艮: scar) + 迹 (辶 walk + 亦: footprint/trace). Dumbledore explains this mark is not a visible scar or trace.'
      interval: 1
      ease: 2.5
    - character: 护身符
      pinyin: hù shēn fú
      meaning: Talisman / Amulet / Protective charm
      explanation: 护 (protect) + 身 (body) + 符 (talisman/symbol). Being loved so deeply leaves us a permanent protective talisman in our very skin.
      interval: 1
      ease: 2.5
    - character: 由于
      pinyin: yóu yú
      meaning: Due to / Because of / Owing to
      explanation: '由 (from/cause) + 于 (at/in). Preposition introducing cause: `正是由于这个原因` (it is precisely for this reason).'
      interval: 1
      ease: 2.5
    - character: 原因
      pinyin: yuán yīn
      meaning: Reason / Cause
      explanation: 原 (source/origin) + 因 (cause). The reason why Quirrell could not touch Harry.
      interval: 1
      ease: 2.5
    - character: 内心
      pinyin: nèi xīn
      meaning: Inner heart / Heart / Inwardly
      explanation: 内 (inside/inner) + 心 (heart/mind). Quirrell's inner heart, which was filled with hatred, greed, and ambition.
      interval: 1
      ease: 2.5
    - character: 充满
      pinyin: chōng mǎn
      meaning: Full of / Filled with / Brimming with
      explanation: 充 (fill) + 满 (full/overflowing). Describes Quirrell's heart being filled with hatred, greed, and ambition.
      interval: 1
      ease: 2.5
    - character: 野心
      pinyin: yě xīn
      meaning: Ambition / Wild ambition
      explanation: 野 (wild/untamed) + 心 (heart). Ruthless, overreaching ambition that led Quirrell to serve Voldemort.
      interval: 1
      ease: 2.5
    - character: 灵魂
      pinyin: líng hún
      meaning: Soul / Spirit
      explanation: '灵 (spirit/divine) + 魂 (cloud + ghost: soul). Quirrell sold his soul (`把灵魂出卖给了`) to Voldemort.'
      interval: 1
      ease: 2.5
    - character: 出卖
      pinyin: chū mài
      meaning: To betray / To sell out
      explanation: 出 (out) + 卖 (to sell). To sell out or betray one's own soul, principles, or comrades.
      interval: 1
      ease: 2.5
