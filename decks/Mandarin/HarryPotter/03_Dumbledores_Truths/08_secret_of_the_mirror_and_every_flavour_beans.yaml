cards:
    - character: 心安理得
      pinyin: xīn ān lǐ dé
      meaning: With a clear conscience / Feeling justified and at ease
      explanation: '心安 (heart at peace) + 理得 (in accord with reason). Idiom: once the debt was paid, Snape could hate James''s memory in peace with a clear conscience.'
      interval: 1
      ease: 2.5
    - character: 重温
      pinyin: chóng wēn
      meaning: To revisit / To relive / To return to (an old feeling or memory)
      explanation: '重 (chóng: again) + 温 (to warm up / review). Dumbledore wryly notes Snape could then return to his old hatred of James (`重温对你父亲的仇恨`).'
      interval: 1
      ease: 2.5
    - character: 努力
      pinyin: nǔ lì
      meaning: To try hard / To make an effort / Diligently
      explanation: '努 (奴 + 力: exert strength) + 力 (strength/effort). Harry tries hard to puzzle through Dumbledore''s explanation about Snape.'
      interval: 1
      ease: 2.5
    - character: 思索
      pinyin: sī suǒ
      meaning: To ponder / To mull over / To think deeply
      explanation: 思 (think) + 索 (search/explore). Harry ponders (`思索着`) Dumbledore's words until his head hurts too much to continue.
      interval: 1
      ease: 2.5
    - character: 段
      pinyin: duàn
      meaning: Paragraph / Passage / Segment (measure word)
      explanation: Measure word for a passage of speech or text (`这段话` = these words / this remark of Dumbledore's).
      interval: 1
      ease: 2.5
    - character: 只好
      pinyin: zhǐ hǎo
      meaning: To have no choice but to / Can only
      explanation: 只 (only) + 好 (good/can). Because his head starts throbbing again, Harry has no choice but to stop thinking about it.
      interval: 1
      ease: 2.5
    - character: 最后
      pinyin: zuì hòu
      meaning: Last / Final / Finally
      explanation: 最 (most) + 后 (after/last). Harry asks Dumbledore one final question (`最后一个问题`) — how he got the Stone out of the Mirror.
      interval: 1
      ease: 2.5
    - character: 锦囊妙计
      pinyin: jǐn náng miào jì
      meaning: Brilliant scheme / Clever stratagem (lit. marvelous plan in a brocade bag)
      explanation: 锦囊 (brocade pouch holding secret instructions) + 妙计 (brilliant plan). Idiom Dumbledore uses for one of his brightest ideas regarding the Mirror of Erised.
      interval: 1
      ease: 2.5
    - character: 之一
      pinyin: zhī yī
      meaning: One of...
      explanation: 之 (of) + 一 (one). Placed at the end of a noun phrase (`我的锦囊妙计之一` = one of my brilliant ideas).
      interval: 1
      ease: 2.5
    - character: 牵涉
      pinyin: qiān shè
      meaning: To involve / To touch upon
      explanation: 牵 (to pull/lead) + 涉 (to wade/involve). Dumbledore says the plan involves (`牵涉到`) an unspoken understanding between him and Harry.
      interval: 1
      ease: 2.5
    - character: 之间
      pinyin: zhī jiān
      meaning: Between / Among
      explanation: 之 (of) + 间 (space between). Used in `你和我之间` (between you and me).
      interval: 1
      ease: 2.5
    - character: 默契
      pinyin: mò qì
      meaning: Tacit understanding / Unspoken rapport
      explanation: 默 (silent) + 契 (contract/agreement). A shared, unspoken understanding and chemistry between Dumbledore and Harry.
      interval: 1
      ease: 2.5
    - character: 了不起
      pinyin: liǎo bù qǐ
      meaning: Amazing / Extraordinary / Remarkable
      explanation: '了 (liǎo: finish/accomplish) + 不起 (beyond ordinary limits). Dumbledore praises the enchantment and their rapport as ''rather remarkable'' (`很了不起的`).'
      interval: 1
      ease: 2.5
    - character: 捞
      pinyin: lāo
      meaning: To scoop up / To dredge for / To rake in (money/gold)
      explanation: 扌 (hand) + 劳 (toil/phonetic). Colloquial verb in `捞金子发财` (raking in gold to get rich).
      interval: 1
      ease: 2.5
    - character: 金子
      pinyin: jīn zi
      meaning: Gold
      explanation: 金 (metal/gold) + 子 (noun suffix). Refers to making gold with the Philosopher's Stone.
      interval: 1
      ease: 2.5
    - character: 发财
      pinyin: fā cái
      meaning: To get rich / To make a fortune
      explanation: 发 (develop/come into) + 财 (wealth). Anyone else looking in the Mirror would just see themselves making gold and getting rich.
      interval: 1
      ease: 2.5
    - character: 或者
      pinyin: huò zhě
      meaning: Or / Either... or...
      explanation: '或 (perhaps/or) + 者 (particle). Connects the two selfish uses of the Stone: getting rich with gold, or drinking the Elixir of Life.'
      interval: 1
      ease: 2.5
    - character: 喝
      pinyin: hē
      meaning: To drink
      explanation: 口 (mouth) + 曷 (phonetic). Drinking (`喝`) the Elixir of Life to extend one's life.
      interval: 1
      ease: 2.5
    - character: 延长
      pinyin: yán cháng
      meaning: To prolong / To extend / To lengthen
      explanation: '延 (stretch/prolong) + 长 (cháng: long). Used in `延长生命` (to prolong life with the Elixir of Life).'
      interval: 1
      ease: 2.5
    - character: 生命
      pinyin: shēng mìng
      meaning: Life
      explanation: 生 (living/birth) + 命 (life/destiny). Biological lifespan that the Elixir of Life extends.
      interval: 1
      ease: 2.5
    - character: 脑瓜
      pinyin: nǎo guā
      meaning: Brain / Head / Noggins (colloquial)
      explanation: 脑 (brain) + 瓜 (melon/gourd — humorous metaphor for the head). Dumbledore's playful colloquial term for his own clever brain (`我的脑瓜`).
      interval: 1
      ease: 2.5
    - character: 好使
      pinyin: hǎo shǐ
      meaning: Works well / Sharp / Handy (colloquial)
      explanation: 好 (good/easy to) + 使 (use). Dumbledore jokes that his brain works so well (`真是好使`) that sometimes he even surprises himself.
      interval: 1
      ease: 2.5
    - character: 有时候
      pinyin: yǒu shí hou
      meaning: Sometimes
      explanation: 有 (there are) + 时候 (times/moments). Dumbledore joking that sometimes (`有时候`) he even amazes himself.
      interval: 1
      ease: 2.5
    - character: 够
      pinyin: gòu
      meaning: Enough / Sufficiently
      explanation: 句 (hook/phonetic) + 多 (many). Used in `问题问得够多的了` (that's quite enough questions for now).
      interval: 1
      ease: 2.5
    - character: 建议
      pinyin: jiàn yì
      meaning: To suggest / Suggestion / To advise
      explanation: 建 (establish/propose) + 议 (discuss/opinion). Dumbledore suggests (`我建议`) Harry start enjoying his sweets.
      interval: 1
      ease: 2.5
    - character: 享受
      pinyin: xiǎng shòu
      meaning: To enjoy
      explanation: 享 (enjoy/partake of) + 受 (receive). Enjoying the hospital wing sweets sent by Harry's friends and admirers.
      interval: 1
      ease: 2.5
    - character: 比比多味豆
      pinyin: Bǐ bǐ duō wèi dòu
      meaning: Bertie Bott's Every Flavour Beans
      explanation: 比比 (transliteration of 'Bertie' + 'every') + 多味 (multi-flavored) + 豆 (beans). The famous wizarding jelly beans with every imaginable flavor.
      interval: 1
      ease: 2.5
    - character: 年轻
      pinyin: nián qīng
      meaning: Young / Youthful
      explanation: 年 (year/age) + 轻 (light/small in number). Dumbledore recalls when he was young (`我年轻的时候`) and ate a vomit-flavored bean.
      interval: 1
      ease: 2.5
    - character: 小心
      pinyin: xiǎo xīn
      meaning: Careful / Cautious (不小心 = accidentally / by mistake)
      explanation: 小 (small) + 心 (heart/mind). Here in `不小心` (inadvertently / by accident), Dumbledore ate a foul-tasting bean in his youth.
      interval: 1
      ease: 2.5
    - character: 颗
      pinyin: kē
      meaning: Measure word for small round objects (beans, pearls, stars)
      explanation: 果 (fruit — small round thing) + 页 (head). Measure word for a single jelly bean (`一颗...豆子`).
      interval: 1
      ease: 2.5
    - character: 味道
      pinyin: wèi dào
      meaning: Taste / Flavor / Smell
      explanation: '味 (口 mouth + 未: taste) + 道 (way/quality). The flavor of the Bertie Bott''s bean.'
      interval: 1
      ease: 2.5
    - character: 臭烘烘
      pinyin: chòu hōng hōng
      meaning: Stinky / Foul-smelling / Revolting
      explanation: 臭 (foul/stinky) + 烘烘 (ABB vivid intensifier for smells/heat). Translates the vomit-flavored ('foul-tasting/stinky') bean Dumbledore ate in his youth.
      interval: 1
      ease: 2.5
    - character: 豆子
      pinyin: dòu zi
      meaning: Bean / Pea
      explanation: 豆 (pictograph of a footed vessel / bean) + 子 (noun suffix). Refers to the Bertie Bott's Every Flavour Beans.
      interval: 1
      ease: 2.5
    - character: 恐怕
      pinyin: kǒng pà
      meaning: I'm afraid that... / Perhaps / Probably
      explanation: '恐 (fear) + 怕 (dread). Used conversationally to mean ''I''m afraid (to say)'': Dumbledore says he''s rather lost his liking for them since then.'
      interval: 1
      ease: 2.5
    - character: 选
      pinyin: xuǎn
      meaning: To choose / To select / To pick
      explanation: 辶 (walk) + 先 (first). Dumbledore decides to pick (`选一颗`) a nice toffee-flavored bean.
      interval: 1
      ease: 2.5
    - character: 太妃糖
      pinyin: tài fēi táng
      meaning: Toffee
      explanation: 太妃 (phonetic loan for 'toffee', lit. 'Grand Consort') + 糖 (candy/sugar). Dumbledore thinks a nice toffee-flavored bean is a safe bet.
      interval: 1
      ease: 2.5
    - character: 口味
      pinyin: kǒu wèi
      meaning: Flavor / Taste / Palate
      explanation: 口 (mouth) + 味 (flavor). Used in `太妃糖口味` (toffee-flavored).
      interval: 1
      ease: 2.5
    - character: 万无一失
      pinyin: wàn wú yī shī
      meaning: Completely safe / A sure thing / No risk at all (lit. ten thousand without one miss)
      explanation: 万 (ten thousand) + 无 (without) + 一 (one) + 失 (mistake/loss). Idiom Dumbledore uses before popping the golden-brown bean into his mouth.
      interval: 1
      ease: 2.5
    - character: 金棕色
      pinyin: jīn zōng sè
      meaning: Golden-brown (color)
      explanation: 金 (gold) + 棕 (palm-bark brown) + 色 (color). The appetizing golden-brown color of the bean that turns out to be earwax.
      interval: 1
      ease: 2.5
    - character: 嘴里
      pinyin: zuǐ lǐ
      meaning: In the mouth / Into the mouth
      explanation: '嘴 (口 mouth + 觜 beak: mouth) + 里 (inside). Dumbledore tosses the golden-brown bean into his mouth (`丢进嘴里`).'
      interval: 1
      ease: 2.5
    - character: 呛
      pinyin: qiàng
      meaning: To choke / To gag (from a pungent or foul taste/smell)
      explanation: 口 (mouth) + 仓 (phonetic). Read `qiàng` when a foul taste or smell makes one gag or cough (`呛得喘不过气来`).
      interval: 1
      ease: 2.5
    - character: 呸
      pinyin: pēi
      meaning: Pah! / Ptui! / Bah! (sound of spitting in disgust)
      explanation: 口 (mouth) + 丕 (phonetic). Onomatopoeic exclamation as Dumbledore gags on the earwax-flavored bean.
      interval: 1
      ease: 2.5
    - character: 耳屎
      pinyin: ěr shǐ
      meaning: Earwax
      explanation: '耳 (ear) + 屎 (excrement/secretion). Dumbledore''s famous punchline upon tasting the golden-brown bean: ''Alas! Earwax!'' (`是耳屎！`).'
      interval: 1
      ease: 2.5
