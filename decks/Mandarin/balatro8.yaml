cards:
    - character: 小盲注
      pinyin: xiǎo máng zhù
      meaning: Small Blind
      explanation: 小 (xiǎo) means 'small', combined with 盲注 (máng zhù) for 'blind bet' from balatro1.yaml[cite: 1]. This is the easiest round of an ante.
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 大盲注
      pinyin: dà máng zhù
      meaning: Big Blind
      explanation: 大 (dà) means 'big' or 'large'. The second round of an ante, which requires more chips than the small blind.
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 三条
      pinyin: sān tiáo
      meaning: Three of a Kind
      explanation: 三 (sān) means 'three' and 条 (tiáo) is a classifier for long, narrow things. This is standard Chinese poker slang for three cards of the same rank.
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 四条
      pinyin: sì tiáo
      meaning: Four of a Kind
      explanation: 四 (sì) means 'four'. Four cards of the same rank.
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
    - character: 两对
      pinyin: liǎng duì
      meaning: Two Pair
      explanation: 两 (liǎng) means 'two' (used for quantities) and 对 (duì) means 'pair'. Two different pairs of cards.
      interval: 1
      ease: 1.3
      next_review: "2026-09-05"
