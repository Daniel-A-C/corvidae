cards:
  - character: مَطَار
    pronunciation: maṭār
    meaning: Airport
    explanation: Place where airplanes operate; shares root with 'ṭāra' (to fly).
  - character: فُنْدُق
    pronunciation: funduq
    meaning: Hotel
    explanation: Lodging and accommodation establishment for visitors and travelers.
  - character: مَطْعَم
    pronunciation: maṭʿam
    meaning: Restaurant
    explanation: Place to eat; derived from the root 'ṭ-ʿ-m' relating to food and eating.
  - character: قِطَار
    pronunciation: qiṭār
    meaning: Train
    explanation: Railway transportation connecting cities and stations.
  - character: تَذْكِرَة
    pronunciation: tadhkirah
    meaning: Ticket
    explanation: Document or card granting passage, transit, or admission.
  - character: أَيْنَ؟
    pronunciation: ayna?
    meaning: Where?
    explanation: Primary question word used to locate places, roads, and facilities.
  - character: كَمِ الثَّمَن؟
    pronunciation: kam ath-thaman?
    meaning: How much does it cost?
    explanation: Essential phrase when inquiring about price in shops or transit.
  - character: مُسَاعَدَة
    pronunciation: musāʿadah
    meaning: Help / Assistance
    explanation: Word used to request assistance or support when in need.
  - character: حِسَاب
    pronunciation: ḥisāb
    meaning: Bill / Check
    explanation: The total or bill requested when finishing dining or shopping.
  - character: جَوَاز سَفَر
    pronunciation: jawāz safar
    meaning: Passport
    explanation: Official travel document; literally 'permission of travel'.
  - character: يَمِين
    pronunciation: yamīn
    meaning: Right (direction)
    explanation: Direction indicating the right side when following navigational directions.
  - character: يَسَار
    pronunciation: yasār
    meaning: Left (direction)
    explanation: Direction indicating the left side when following navigational directions.
